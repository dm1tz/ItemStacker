name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v5.0.0
        with:
          show-progress: false
          submodules: recursive
      - name: Parse plugin name from Directory.Build.props
        if: ${{ steps.release.outputs.release_created }}
        id: plugin-name
        uses: mavrosxristoforos/get-xml-info@2.0
        with:
          xml-file: 'Directory.Build.props'
          xpath: '//PluginName'
      - name: Download latest artifact
        if: ${{ steps.release.outputs.release_created }}
        uses: dawidd6/action-download-artifact@v12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci.yml
          name: ${{ steps.plugin-name.outputs.info }}
          check_artifacts: true
          skip_unpack: true
      - name: Upload release artifact
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} ${{ steps.plugin-name.outputs.info }}.zip
